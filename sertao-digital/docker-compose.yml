services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sertao_digital
      POSTGRES_USER: sertao
      POSTGRES_PASSWORD: sertao_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sertao -d sertao_digital"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    container_name: api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://sertao:sertao_dev@db:5432/sertao_digital
      TEST_DATABASE_URL: postgresql+psycopg://sertao:sertao_dev@db:5432/sertao_digital_test
      JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-em-producao}
      TOKEN_MINUTES: 120
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
